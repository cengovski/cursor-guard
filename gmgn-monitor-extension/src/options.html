<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>GMGN Monitor ayarları</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>GMGN Monitor ayarları</h1>
    <p class="hint">Giriş yapmış olduğunuz gmgn.ai monitörünü okur. Şifre veya çerez saklamaz. Boş filtre sınırı yoktur.</p>
    <form id="form">
      <fieldset>
        <legend>Telegram</legend>
        <label>Bot token <input id="botToken" type="password" autocomplete="off" /></label>
        <label>Sohbet ID <input id="chatId" type="text" autocomplete="off" /></label>
      </fieldset>
      <fieldset>
        <legend>Filtreler</legend>
        <label>Min piyasa değeri (USD) <input id="minMarketCap" type="text" placeholder="boş = sınır yok" /></label>
        <label>Min hacim (USD) <input id="minVolume" type="text" placeholder="boş = sınır yok" /></label>
        <label>Min mutlak giriş (USD) <input id="minInflowAbs" type="text" placeholder="boş = sınır yok" /></label>
        <label>Min fiyat değişimi (%) <input id="minPriceChange" type="text" placeholder="boş = sınır yok" /></label>
        <label>Min cüzdan satırı <input id="minWalletRows" type="text" placeholder="boş = sınır yok" /></label>
        <label class="check"><input id="positiveInflowOnly" type="checkbox" /> Yalnızca pozitif giriş</label>
      </fieldset>
      <fieldset>
        <legend>Tarama</legend>
        <label>Bekleme (saniye) <input id="dwellSeconds" type="number" min="1" step="1" value="7" /></label>
        <label>Zaman aralığı
          <select id="timeframe">
            <option>1m</option>
            <option>5m</option>
            <option>15m</option>
            <option selected>1h</option>
            <option>6h</option>
            <option>24h</option>
          </select>
        </label>
        <div class="group" id="chains">
          <span>Zincirler</span>
          <label class="check"><input type="checkbox" data-chain="sol" checked /> SOL</label>
          <label class="check"><input type="checkbox" data-chain="bsc" checked /> BSC</label>
          <label class="check"><input type="checkbox" data-chain="robinhood" checked /> Robinhood</label>
          <label class="check"><input type="checkbox" data-chain="base" checked /> Base</label>
          <label class="check"><input type="checkbox" data-chain="eth" checked /> ETH</label>
          <label class="check"><input type="checkbox" data-chain="arc" checked /> ARC</label>
        </div>
        <div class="group" id="tabs">
          <span>Sekmeler</span>
          <label class="check"><input type="checkbox" data-tab="Track" checked /> Track</label>
          <label class="check"><input type="checkbox" data-tab="Smart" checked /> Smart</label>
          <label class="check"><input type="checkbox" data-tab="KOL" checked /> KOL</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Bağlantılar</legend>
        <label>Dex <input id="urlDex" type="text" /></label>
        <label>GMGN <input id="urlGmgn" type="text" /></label>
        <label>Based <input id="urlBased" type="text" /></label>
        <label>Banana <input id="urlBanana" type="text" /></label>
        <label>Maestro <input id="urlMaestro" type="text" /></label>
        <label>Rick <input id="urlRick" type="text" /></label>
      </fieldset>
      <div class="row">
        <button id="save" type="submit">Kaydet</button>
        <button id="reset" type="button">Havuzu sıfırla</button>
        <button id="test" type="button">Test mesajı</button>
      </div>
    </form>
    <p id="note"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
